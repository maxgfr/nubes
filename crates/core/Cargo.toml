[package]
name = "nubes-core"
version = "0.0.0"
description = "nubes sync engine: git blob hashing, ignore rules and the three-way sync planner. Pure, no I/O."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
