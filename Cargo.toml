[workspace]
resolver = "2"
members = ["crates/core", "crates/wasm", "cli"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/maxgfr/nubes"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# The engine shipped to the browser: small over fast.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"
